id = 'codex'
name = 'Codex'
version = "0.1.0"
description = 'Codex execution and protocol inspection through standard MCP.'

[[mcp]]
id = 'app-server'
transport = 'stdio'
executable = { platform_paths = { macos = 'bin/codex-mcp-adapter' } }
capabilities = ['tools']

[compatibility]
minimum_host = '0.1.0'
platforms = ['macos']
architectures = ['arm64', 'x86_64']

[[compatibility.artifacts]]
name = 'codex-plugin-macos-arm64.zip'
platforms = ['macos']
architectures = ['arm64']
