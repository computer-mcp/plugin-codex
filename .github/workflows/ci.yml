name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependency gate tooling
        run: brew install jq ripgrep
      - name: Validate Swift package
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/version.py check
          if [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ && "$BASE_COMMIT" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/version.py check --base "$BASE_COMMIT"
          fi
          /usr/bin/swift --version
          /usr/bin/swift package resolve
          git diff --exit-code -- Package.resolved
          scripts/verify-swift-codex-release-gate.sh
          node --test Tests/schema-import.test.mjs
          node scripts/import-schema.mjs --check
          /usr/bin/swift format lint --strict --recursive Package.swift Sources Tests
          /usr/bin/swift build --build-tests --disable-automatic-resolution
      - name: Run Swift tests
        timeout-minutes: 10
        run: |
          /usr/bin/sw_vers
          /usr/sbin/sysctl -n hw.logicalcpu
          /usr/bin/swift test --skip-build --disable-automatic-resolution --no-parallel &
          test_pid=$!
          for ((elapsed = 0; elapsed < 60; elapsed++)); do
            if ! /bin/kill -0 "$test_pid" 2>/dev/null; then break; fi
            /bin/sleep 1
          done
          if /bin/kill -0 "$test_pid" 2>/dev/null; then
            /bin/ps -p "$test_pid" -o pid=,ppid=,etime=,comm= || true
            for process_id in $(/usr/bin/pgrep -P "$test_pid" || true); do
              process_command=$(/bin/ps -p "$process_id" -o comm= || true)
              case "$process_command" in
                *swiftpm-testing*) /usr/bin/sample "$process_id" 1 || true ;;
              esac
            done
          fi
          wait "$test_pid"
      - name: Validate package ownership and publication
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
          python3 scripts/check-workflow.py --check-release-workflow
      - name: Build relocatable adapter and receipt
        run: |
          python3 scripts/package.py --output dist --configuration release
          python3 scripts/check-package.py --archive dist/codex-plugin-macos-arm64.zip --receipt dist/receipt.json --destination .build/accepted-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-plugin-macos-arm64-${{ github.sha }}
          path: |
            dist/codex-plugin-macos-arm64.zip
            dist/receipt.json
          if-no-files-found: error
          retention-days: 14

  validate:
    if: always()
    needs: [package]
    uses: computer-mcp/github-workflows/.github/workflows/result.yml@fd25fcface41732fda099017c6945912366fc7c1
    with:
      needs-json: ${{ toJSON(needs) }}
