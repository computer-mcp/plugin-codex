name: Release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Accepted successful CI run ID (frozen receipt takes precedence on recovery)
        type: string
        required: true
      release_tag:
        description: Signed annotated version tag (omit for a dry run)
        type: string
        required: false
      publish:
        description: Publish the verified release
        type: boolean
        default: false
permissions: {}
concurrency:
  group: plugin-release-${{ github.repository }}-${{ inputs.release_tag || inputs.source_run }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'computer-mcp/plugin-codex' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      asset_digests: ${{ steps.bundle.outputs.asset_digests }}
      helper_digest: ${{ steps.bundle.outputs.helper_digest }}
      tag: ${{ steps.bundle.outputs.tag }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify native CI artifacts and assemble the frozen release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I Scripts/plugin_release.py verify \
            --repository "$GH_REPOSITORY" --source-run "$SOURCE_RUN" \
            --tag "$RELEASE_TAG" --publish "$RELEASE_PUBLISH" \
            --workflow-ref "$RELEASE_WORKFLOW_REF" --workflow-sha "$RELEASE_WORKFLOW_SHA" \
            --output .build/plugin-release/assets
          python3 -I - <<'PY'
          import hashlib, os
          from pathlib import Path
          data = Path('Scripts/plugin_release.py').read_bytes()
          Path('.build/plugin-release/plugin_release.py').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('helper_digest=' + hashlib.sha256(data).hexdigest() + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: plugin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/plugin-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/plugin-release
          merge-multiple: true
      - name: Verify the helper and publish only the verified bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_ASSET_DIGESTS: ${{ needs.verify.outputs.asset_digests }}
          RELEASE_HELPER_DIGEST: ${{ needs.verify.outputs.helper_digest }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'plugin-release'
          helper = root / 'plugin_release.py'
          if helper.is_symlink() or hashlib.sha256(helper.read_bytes()).hexdigest() != os.environ['RELEASE_HELPER_DIGEST']:
              raise SystemExit('Release helper differs from the verify job digest')
          subprocess.run([sys.executable, '-I', str(helper), 'publish',
                          '--repository', os.environ['GH_REPOSITORY'],
                          '--directory', str(root / 'assets'),
                          '--asset-digests', os.environ['RELEASE_ASSET_DIGESTS']], check=True)
          PY
  notify-catalog:
    needs: publish
    if: inputs.publish && needs.publish.outputs.published == 'true'
    permissions: {}
    uses: ./.github/workflows/notify-catalog.yml
    secrets:
      CATALOG_APP_PRIVATE_KEY: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
