name: Validate and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_sdk_revision:
        description: 'Exact swift-codex candidate commit for the isolated Windows source audit; empty runs normal packaging'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    if: ${{ inputs.windows_sdk_revision == '' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependency gate tooling
        run: brew install jq ripgrep
      - name: Validate Swift package
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 Scripts/version.py check
          if [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ && "$BASE_COMMIT" != 0000000000000000000000000000000000000000 ]]; then
            python3 Scripts/version.py check --base "$BASE_COMMIT"
          fi
          /usr/bin/swift --version
          /usr/bin/swift package resolve
          git diff --exit-code -- Package.resolved
          Scripts/verify-swift-codex-release-gate.sh
          node --test Tests/schema-import.test.mjs
          node Scripts/import-schema.mjs --check
          /usr/bin/swift format lint --strict --recursive Package.swift Sources Tests
          /usr/bin/swift build --build-tests --disable-automatic-resolution
      - name: Run Swift tests
        timeout-minutes: 10
        run: |
          /usr/bin/sw_vers
          /usr/sbin/sysctl -n hw.logicalcpu
          /usr/bin/swift test --skip-build --disable-automatic-resolution --no-parallel &
          test_pid=$!
          for ((elapsed = 0; elapsed < 60; elapsed++)); do
            if ! /bin/kill -0 "$test_pid" 2>/dev/null; then break; fi
            /bin/sleep 1
          done
          if /bin/kill -0 "$test_pid" 2>/dev/null; then
            /bin/ps -p "$test_pid" -o pid=,ppid=,etime=,comm= || true
            for process_id in $(/usr/bin/pgrep -P "$test_pid" || true); do
              process_command=$(/bin/ps -p "$process_id" -o comm= || true)
              case "$process_command" in
                *swiftpm-testing*) /usr/bin/sample "$process_id" 1 || true ;;
              esac
            done
          fi
          wait "$test_pid"
      - name: Validate package ownership and publication
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build relocatable adapter and receipt
        run: python3 Scripts/package.py --output dist --configuration release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-plugin-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/codex-plugin.zip
            dist/receipt.json
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    if: ${{ inputs.windows_sdk_revision != '' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Audit native dependencies and complete adapter source
        shell: pwsh
        env:
          CODEX_CANDIDATE_REVISION: ${{ inputs.windows_sdk_revision }}
        run: ./Scripts/validate-windows-candidate.ps1 -SDKRevision $env:CODEX_CANDIDATE_REVISION
      - name: Preserve Windows source audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-plugin-windows-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-candidate/evidence/
          include-hidden-files: true
          if-no-files-found: error

  windows-process:
    if: ${{ inputs.windows_sdk_revision != '' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate exact SDK input
        shell: pwsh
        env:
          CODEX_CANDIDATE_REVISION: ${{ inputs.windows_sdk_revision }}
        run: |
          if ($env:CODEX_CANDIDATE_REVISION -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Windows process acceptance requires an exact SDK commit'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: swift-library/swift-codex
          ref: ${{ inputs.windows_sdk_revision }}
          path: .build/windows-process-sdk
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Test exact production process sources in debug and release
        shell: pwsh
        run: ./Scripts/test-windows-process.ps1 -SDKPath .build/windows-process-sdk -OutputDirectory .build/windows-process
      - name: Preserve native process acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-plugin-windows-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-process/evidence/
          include-hidden-files: true
          if-no-files-found: error

  windows-host-mcp:
    if: ${{ inputs.windows_sdk_revision != '' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate exact SDK input
        shell: pwsh
        env:
          CODEX_CANDIDATE_REVISION: ${{ inputs.windows_sdk_revision }}
        run: |
          if ($env:CODEX_CANDIDATE_REVISION -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Host MCP acceptance requires an exact SDK commit'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: swift-library/swift-codex
          ref: ${{ inputs.windows_sdk_revision }}
          path: .build/windows-host-sdk
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Test inherited host pipes with the complete MCP candidate
        shell: pwsh
        run: ./Scripts/test-windows-host-mcp.ps1 -SDKPath .build/windows-host-sdk -OutputDirectory .build/windows-host-mcp
      - name: Preserve native host MCP acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-plugin-windows-host-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-host-mcp/evidence/
          include-hidden-files: true
          if-no-files-found: error
