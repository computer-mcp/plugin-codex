name: Notify official plugin catalog
on:
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:
  workflow_call:
    secrets:
      CATALOG_APP_PRIVATE_KEY:
        description: Private key of the receiver-scoped catalog GitHub App
        required: true
    outputs:
      run_url:
        description: Accepted central run; verify its deployment separately
        value: ${{ jobs.notify.outputs.run_url }}
permissions: {}
jobs:
  notify:
    if: github.repository_id == '1368122608'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_url: ${{ steps.catalog.outputs.run-url }}
    steps:
      - name: Request complete catalog reconciliation
        id: catalog
        uses: computer-mcp/computer-mcp.github.io/.github/actions/notify-catalog@16c9bf551879178ee542f9b25d42a217aedf81c3
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
