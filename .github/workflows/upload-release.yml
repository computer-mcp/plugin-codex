name: Upload verified release archive
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Validate and package run ID
        required: true
      release_tag:
        description: Existing draft release tag bound to the verified commit
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: release-upload-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'computer-mcp/plugin-codex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify source and draft, then upload the existing archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            .event == "push" and .head_branch == "main" and
            .path == ".github/workflows/validate.yml" and
            .head_repository.full_name == $repo' run.json > /dev/null
          source_sha=$(jq -r .head_sha run.json)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag-ref.json
          [[ $(jq -r .object.type tag-ref.json) == tag ]]
          tag_object=$(jq -r .object.sha tag-ref.json)
          gh api "repos/$GH_REPO/git/tags/$tag_object" > tag.json
          jq -e --arg sha "$source_sha" '.object.type == "commit" and .object.sha == $sha' tag.json > /dev/null
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --slurp > releases.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$source_sha" '
            [ .[][] | select(.tag_name == $tag) ] |
            if length == 1 and .[0].draft and .[0].target_commitish == $sha
            then .[0] else error("Expected one commit-bound draft release") end
          ' releases.json > release.json
          release_id=$(jq -r .id release.json)
          gh run download "$SOURCE_RUN" --name "codex-plugin-ARM64-$source_sha" --dir artifact
          cd artifact
          expected=$(jq -r .archive_sha256 receipt.json)
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  codex-plugin.zip\n' "$expected" | sha256sum --check --strict
          unzip -t codex-plugin.zip
          gh api "repos/$GH_REPO/releases/$release_id/assets" > assets.json
          existing=$(jq -r '.[] | select(.name == "codex-plugin.zip") | .id' assets.json)
          if [[ -n "$existing" ]]; then
            jq -e --argjson id "$existing" --arg digest "sha256:$expected" '
              .[] | select(.id == $id) |
              .state == "starter" or (.state == "uploaded" and .digest == $digest)
            ' assets.json > /dev/null
            if jq -e --argjson id "$existing" '.[] | select(.id == $id) | .state == "uploaded"' assets.json > /dev/null; then
              exit 0
            fi
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$existing"
          fi
          gh api --method POST "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=codex-plugin.zip" \
            --input codex-plugin.zip -H 'Content-Type: application/zip' > uploaded.json
          jq -e --arg digest "sha256:$expected" '.state == "uploaded" and .digest == $digest' uploaded.json > /dev/null
